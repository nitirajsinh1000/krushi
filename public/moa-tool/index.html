</div>

<div id="searchOut"></div>
</section>
<!-- TANK MIX -->
<section class="tab" id="tab-ctl">
<div class="card"><h2 data-i18n="ctlTitle"></h2><p class="muted" data-i18n="ctlDesc"></p>
<div class="stp"><span class="no">1</span><span data-i18n="ctlCrop"></span></div>

<div class="stp"><span class="no">2</span><span data-i18n="ctlType"></span></div>

<div class="chips" id="ctlSel"></div>
<input type="text" id="ctlFind" autocomplete="off" data-i18n-ph="ctlFind">
<div class="tlist" id="ctlList"></div>
<div class="row2"><button type="button" class="btn alt" id="ctlClear" data-i18n="ctlClear"></button><label class="chk" id="ctlAllW"><input type="checkbox" id="ctlAll"><span data-i18n="ctlOnlyAll"></span></label></div>
</div>
<details class="card" id="ctlProd"><summary data-i18n="prodSearch"></summary><p class="muted" data-i18n="prodHelp"></p><input type="text" id="ctlQ" autocomplete="off" data-i18n-ph="prodSearchPh"><div id="ctlQOut"></div></details>
<div id="ctlOut"></div></section>

<div class="stp"><span class="no">2</span><span data-i18n="stepCheck"></span></div><button class="btn" type="button" id="tankBtn" data-i18n="tankBtn"></button>
</div>
<div id="tankOut"></div>
</div>

</div></section>

Object.assign(LANG.en,{"tabStats":"Stats","browse":"Browse mode-of-action groups","browseHint":"Pick a category, then tap a group to read its full explanation.","guideTitle":"📘 How resistance works (read first)","guide1":"Resistance is natural selection: each spray kills susceptible individuals and the few resistant ones multiply. Repeating the same mode of action (MoA) raises their share.","guide2":"FRAC (fungicides), IRAC (insecticides) and HRAC (herbicides) number products by MoA. Same code = cross-resistant: if one fails, others in the group usually fail too.","guide3":"Rotate or mix different CODES, not brand names. Same active ingredient or code = same MoA.","guide4":"Multi-site fungicides (FRAC M) carry very low resistance risk: the best partners for high-risk single-site products.","guide5":"Never cut the label dose; sub-lethal doses speed up resistance. Spray on time with good coverage, and combine with IPM. The label and local advice always prevail.","advDetails":"Advanced details","modeLabel":"Mobility / how it acts","resLabel":"Resistance mechanism","crossLabel":"Cross-resistance","targetsLabel":"Typical targets","strategyLabel":"Anti-resistance strategy","maxLabel":"Spray limit guideline","premixLabel":"Found in premixes","mode_sys":"Systemic: absorbed and moved inside the plant","mode_ts":"Translaminar / locally systemic: enters the leaf, limited movement","mode_con":"Contact: acts only where it lands, needs full coverage","mode_ing":"Contact + stomach (ingestion)","mode_pre":"Soil-applied / pre-emergence: acts on germinating weeds","mode_post":"Foliar post-emergence: absorbed by leaves","res_t":"Target-site mutation","res_m":"Metabolic (detoxification) resistance","res_tm":"Target-site and metabolic resistance","res_n":"No practical resistance (multi-site)","res_u":"Mechanism unclear / few reports","crossGroup":"Expected among all {n} active ingredients of this group (general rule); usually none with other groups.","crossNone":"Not expected: multi-sit ोधी रणनीति","maxLabel":"छिड़काव सीमा (मार्गदर्शन)","premixLabel":"इन मिश्रित उत्पादों में","mode_sys":"सिस्टमिक: पौधे के अंदर सोखा और फैलता है","mode_ts":"ट्रांसलैमिनार / स्थानीय सिस्टमिक: पत्ती में घुसता है, सीमित गति","mode_con":"संपर्क: जहाँ पड़ता है वहीं असर करता है, पूरा कवरेज चाहिए","mode_ing":"संपर्क + पेट (खाने से)","mode_pre":"मिट्टी में डालें / उगने से पहले: अंकुरित खरपतवार पर असर","mode_post":"पत्तियों पर, उगने के बाद: पत्तियों से सोखा जाता है","res_t":"लक्ष्य-स्थल उत्परिवर्तन","res_m":"चयापचय (विषहरण) प्रतिरोध","res_tm":"लक्ष्य-स्थल व चयापचय दोनों","res_n":"व्यावहारिक प्रतिरोध नहीं (बहु-स्थल)","res_u":"तंत्र अस्पष्ट / कम रिपोर्ट","crossGroup":"इस समूह के सभी {n} सक्रिय तत्वों में अपेक्षित (सामान्य नियम); अन्य समूहों से आमतौर पर नहीं।","crossNone":"अपेक्षित नहीं: बहु-स्थल क्रिया।","advFhigh":"उच्च जोखिम: केवल मिश्रण में या बहु-स्थल साथी के साथ बारी-बारी से प्रयोग करें; लगातार दो बार न डालें।","advFmedium":"मध्यम जोखिम: असंबंधित समूहों के साथ बदलते रहें, पूरी लेबल मात्रा रखें, बार-बार न छिड़कें।","advFlow":"कम जोखिम: फिर भी लेबल का पालन करें; मिश्रण/रोटेशन के साथी के रूप में उपयोगी।","advM":"बहु-स्थल रक्षक: संक्रमण से पहले अच्छे कवरेज से छिड़कें; एकल-स्थल फफूंदनाशियों का आदर्श साथी।","advI":"हर IRAC समूह को केवल एक कीट-पीढ़ी (लगभग 30 दिन) के लिए प्रयोग करें, फिर समूह बदलें। आर्थिक सीमा पर छिड़कें और मित्र कीटों को बचाएं।","advH":"हर मौसम HRAC समूह बदलें, दो असरदार समूह मिलाएं, सही खरपतवार अवस्था पर पूरी मात्रा में छिड़कें और खेतों के बीच स्प्रेयर साफ करें।","maxFhigh":"प्रति फसल मौसम अधिकतम 2 छिड़काव, लगातार नहीं (सामान्य मार्गदर्शन; लेबल सर्वोपरि)।","maxFmedium":"प्रति फसल मौसम अधिकतम 3 छिड़काव (सामान्य मार्गदर्शन; लेबल सर्वोपरि)।","maxFlow":"लेबल का पालन करें; प्रतिरोध की कड़ी सीमा नहीं।","maxM":"लेबल की सीमा मानें (जैसे कॉपर/सल्फर से पत्ती जलना); प्रतिरोध सीमा नहीं।","maxI":"प्रति समूह एक कीट-पीढ़ी (लगभग 30 दिन)।","maxH":"प्रति खेत प्रति मौसम एक बार; हर साल समूह बदलें।","more":"+{n} और","dupExplain":"एक ही MoA दो बार डालने से चयन-दबाव दोगुना होता है, नि CATS.forEach(function(cat){for(var k in DATA[cat]){DATA[cat][k].ai.forEach(function(a){IDX[norm(a)]={cat:cat,code:DATA[cat][k].code};});}});
function COMBO(id,brands,generic,ais,risk){
var comps=ais.map(function(a){var r=IDX[norm(a)];return {ai:a,cat:r.cat,code:r.code,label:LBL[r.cat]};});
var cats={};comps.forEach(function(c){cats[c.cat]=1;});
var mainCat=Object.keys(cats).length===1?comps[0].cat:'mixed';
var pretty=comps.map(function(c){return cap(c.ai);}).join(' + ');
var name=brands.length?pretty+' ('+brands.join(' / ')+')':pretty;
DATA.combination[id]={code:comps.map(function(c){return c.code;}).join('+'),name:name,
ai:brands.concat([generic]),type:'combination',risk:risk,components:comps,mainCat:mainCat};
}

function advHTML(cat,code,open){

function catOf(it){return it.type==='combination'?it.mainCat:it.cat;}
function flatten(it){
if(it.type==='combination'){
return it.components.map(function(c){var g=DATA[c.cat][c.code];return {cat:c.cat,code:c.code,label:c.label,ai:c.ai,risk:g.risk,name:g.name};});
}
return [{cat:it.cat,code:it.code,label:it.label,ai:it.ingredient,risk:it.risk,name:it.name}];
}
function maxRisk(parts){var m='low';parts.forEach(function(p){if(RANK[p.risk]>RANK[m])m=p.risk;});return m;}
function sortedMatches(q){
q=norm(q);if(!q)return [];
var seen={},pre=[],sub=[];
ALL.forEach(function(it){
var p=it.key.indexOf(q);if(p<0||seen[it.key])return;
seen[it.key]=1;(p===0?pre:sub).push(it);
});
function cmp(a,b){return a.key<b.key?-1:a.key>b.key?1:0;}
return pre.sort(cmp).concat(sub.sort(cmp));
}
function searchAll(q){return sortedMatches(q);}
function suggest(q){if(norm(q).length<2)return [];return sortedMatches(q).slice(0,12);}
function findOne(q){
var n=norm(q);if(!n)return null;
for(var i=0;i<ALL.length;i++){if(ALL[i].key===n)return ALL[i];}
var m=sortedMatches(n);return m.length?m[0]:null;
}
function hl(text,q){
var i=text.toLowerCase().indexOf(q);
if(!q||i<0)return esc(text);
return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function renderTankOut(){
var out=$('tankOut');
if(!state.tankChecked){out.innerHTML='';return;}
if(!state.tank.length){out.innerHTML='<div class="card"><div class="warn">'+esc(T('addFirst'))+'</div></div>';return;}
var parts=[];state.tank.forEach(function(it){flatten(it).forEach(function(p){parts.push(p);});});
var cnt={};parts.forEach(function(p){var k=p.cat+':'+p.code;cnt[k]=(cnt[k]||0)+1;});
var dups=Object.keys(cnt).filter(function(k){return cnt[k]>1;});
var highs=[],hs={},covered=false,cats={};
parts.forEach(function(p){
cats[p.cat]=1;
if(p.risk!=='high')return;
var multi=parts.some(function(q){return q.cat===p.cat&&/^M/.test(q.code);});
var k=p.label+' '+p.code;
if(multi)covered=true;else if(!hs[k]){hs[k]=1;highs.push(k);}
});
var score=Math.max(0,100-dups.length*30-highs.length*20);
var lv=score>=80?'low':score>=50?'medium':'high',rk=score>=80?'rGood':score>=50?'rFair':'rPoor';
var h='<div class="card"><h2>'+esc(T('productsInMix'))+'</h2><div class="chips">'+
state.tank.map(function(it){return '<span class="chip k-'+catOf(it)+'">'+esc(it.ingredient)+'</span>';}).join('')+'</div></div>';
h+='<div class="card"><h2>'+esc(T('detectedGroups'))+'</h2><div class="chips">'+
parts.map(function(p){var d=cnt[p.cat+':'+p.code]>1;return '<span class="chip k-'+p.cat+(d?' dup':'')+'">'+esc(p.label)+' '+esc(p.code)+'</span>';}).join('')+'</div>';
dups.forEach(function(k){
var p=parts.filter(function(q){return q.cat+':'+q.code===k;})[0];
h+='<div class="warn">⚠️ '+esc(fmt(T('dupWarn'),{c:p.label+' '+p.code}))+'<br><small>'+esc(T('dupExplain'))+'</small></div>';
});
if(highs.length)h+='<div class="warn">⚠️ '+esc(fmt(T('highWarn'),{c:highs.join(', ')}))+'</div>';
if(covered)h+='<div class="ok">✅ '+esc(T('partnerOk'))+'</div>';
if(!dups.length&&!highs.length)h+='<div class="ok">✅ '+esc(T('clean'))+'</div>';
h+='</div>';
var alk=parts.some(function(p){return p.cat==='fungicide'&&((p.code==='M01'&&/bordeaux/i.test(p.ai))||/lime sulfur/i.test(p.ai));});
var hyd=parts.some(function(p){return p.cat==='insecticide'&&(p.code==='1A'||p.code==='1B'||p.code==='3A');});
var cu=parts.some(function(p){return p.cat==='fungicide'&&p.code==='M01';});
var adv='';
if(alk&&hyd)adv+='<div class="warn">⚠️ '+esc(T('alkWarn'))+'</div>';
if(cu&&parts.length>1)adv+='<div class="info">ℹ️ '+esc(T('copperInfo'))+'</div>';
if(cats.herbicide&&(cats.fungicide||cats.insecticide))adv+='<div class="warn">⚠️ '+esc(T('herbWarn'))+'</div>';
h+='<div class="card"><h2>'+esc(T('ratingLabel'))+': <span class="risk r-'+lv+'">'+esc(T(rk))+'</span></h2><div class="meter m-'+lv+'"><i style="width:'+score+'%"></i></div>'+
'<div class="muted">'+esc(fmt(T('distinctN'),{n:Object.keys(cnt).length}))+'</div>'+adv+'<div class="info">🧪 '+esc(T('jarTip'))+'</div></div>';
out.innerHTML=h;
}

var out=$('rotOut');
if(!state.rotChecked){out.innerHTML='';return;}
if(!state.rot.length){out.innerHTML='<div class="card"><div class="warn">'+esc(T('addFirst'))+'</div></div>';return;}
var flat=state.rot.map(flatten),n=state.rot.length,h='';
state.rot.forEach(function(it,i){
var ps=flat[i],r=maxRisk(ps);
h+='<div class="srow k-'+catOf(it)+'"><div><span class="n">#'+(i+1)+'</span> <span class="nm">'+esc(it.ingredient)+'</span></div>'+
'<div class="badges">'+ps.map(function(p){return badge(p.cat,p.label,p.code);}).join('')+'</div>'+

function shared(a,b){var s=[],seen={};a.forEach(function(p){b.forEach(function(q){var k=p.cat+':'+p.code;if(p.cat===q.cat&&p.code===q.code&&!seen[k]){seen[k]=1;s.push(p.label+' '+p.code);}});});return s;}
var warns=[],infos=[];
for(var i=0;i<n-1;i++){
var s=shared(flat[i],flat[i+1]);
if(s.length)warns.push(fmt(T('shareWarn'),{a:i+1,an:state.rot[i].ingredient,b:i+2,bn:state.rot[i+1].ingredient,c:s.join(', ')}));
}
for(var j=0;j<n-2;j++){
var s2=shared(flat[j],flat[j+2]);
if(s2.length&&!shared(flat[j],flat[j+1]).length&&!shared(flat[j+1],flat[j+2]).length)infos.push(fmt(T('twoApart'),{c:s2.join(', '),a:j+1,b:j+3}));
}
var cnt={},lab={};
flat.forEach(function(ps){var seen={};ps.forEach(function(p){var k=p.cat+':'+p.code;if(!seen[k]){seen[k]=1;cnt[k]=(cnt[k]||0)+1;lab[k]=p.label+' '+p.code;}});});
Object.keys(cnt).forEach(function(k){
if(n>=3&&cnt[k]>=2&&cnt[k]/n>1/3&&!/^M/.test(k.split(':')[1]))warns.push(fmt(T('overFrac'),{c:lab[k],a:cnt[k],b:n}));
});
var distinct=Object.keys(cnt).length;
h+='<div class="card">';
if(warns.length)h+=warns.map(function(w){return '<div class="warn">⚠️ '+esc(w)+'</div>';}).join('');
else h+='<div class="ok">✅ '+esc(T('goodRot'))+'</div>';
h+=infos.map(function(w){return '<div class="info">ℹ️ '+esc(w)+'</div>';}).join('');
h+='<div class="muted" style="margin-top:8px">'+esc(fmt(T('diversityLbl'),{n:distinct,m:n}))+'</div></div>';
var lastCat=flat[n-1][0].cat,recent={};
[n-1,n-2].forEach(function(i){if(i>=0)flat[i].forEach(function(p){if(p.cat===lastCat)recent[p.code]=1;});});
var cand=Object.keys(DATA[lastCat]).filter(function(c){return !recent[c];}).sort(function(a,b){return RANK[DATA[lastCat][a].risk]-RANK[DATA[lastCat][b].risk];}).slice(0,6);
if(cand.length)h+='<div class="card"><h2>'+esc(T('suggestNext'))+'</h2><div class="chips">'+cand.map(function(c){return '<span class="chip sm k-'+lastCat+'">'+LBL[lastCat]+' '+esc(c)+' · '+esc(DATA[lastCat][c].name)+'</span>';}).join('')+'</div></div>';
out.innerHTML=h;
}

 });
 h+='<div class="gsec"><span class="no">1</span>'+esc(T('gPlan'))+'</div><div class="plan3">'+plan+'</div>';
 h+='<div class="gsec"><span class="no">2</span>'+esc(T('gMix'))+'</div><div class="gsub">'+esc(T('gMixD'))+'</div>'+[1,2,3].map(function(l){return lvBlock(l,rows(mixc,l,true));}).join('');
 h+='<div class="gsec"><span class="no">3</span>'+esc(T('gRot'))+'</div><div class="gsub">'+esc(T('gRotD'))+'</div>'+[1,2,3].map(function(l){return lvBlock(l,rows(rotc,l,false));}).join('');
 var gap=cat==='fungicide'?(allM?'maxM':'maxF'+(parts.some(function(p){return DATA[cat][p.code].risk==='high';})?'high':parts.some(function(p){return DATA[cat][p.code].risk==='medium';})?'medium':'low')):cat==='insecticide'?'maxI':'maxH';
 h+='<div class="info">⏱️ <b>'+esc(T('gGap'))+'</b><br>'+esc(T(gap))+'</div>';
 h+='<div class="info">🎯 '+esc(T('gMatch'))+'</div>';
 /* cautions */
 var cl=[];
 cl.push(fmt(T('cSame'),{c:parts.map(function(p){return p.label+' '+p.code;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(', ')}));
 if(cat==='insecticide'&&(gx['1A']||gx['1B']||gx['3A']))cl.push(T('alkWarn'));
 if(cat==='fungicide'&&(gx['M01']||parts.some(function(p){return /lime sulfur/i.test(p.ai);})))cl.push(T('alkWarn'),T('copperInfo'));
 if(cat==='herbicide'){cl.push(T('herbWarn'));if(anti['4']||anti['1'])cl.push(T('cAnt'));}
 cl.push(T('jarTip'));
 h+='<div class="gsec"><span class="no">⚠</span>'+esc(T('gAvoid'))+'</div>'+cl.map(function(x){return '<div class="warn">'+esc(x)+'</div>';}).join('');
 if(proof.length)h+='<div class="gsec"><span class="no">✔</span>'+esc(T('gProof'))+' ('+proof.length+')</div><div class="gsub">'+esc(T('gProofD'))+'</div><div class="card" style="font-size:14px">'+proof.slice(0,12).map(function(n){return '• '+esc(n);}).join('<br>')+(proof.length>12?'<br>…':'')+'</div>';
 return h;
}
function partnerHTML(item){
 var parts=flatten(item),cats={};
 parts.forEach(function(p){(cats[p.cat]=cats[p.cat]||[]).push(p);});
 return Object.keys(cats).map(function(c){return catPart(c,cats[c],item);}).join('');
}
function renderPartner(){
 var q=$('guideQuick');
 if(q)q.innerHTML=QUICK.map(function(n){return '<button type="button" class="chip k-mixed" data-q="'+esc(n)+'">'+esc(cap(n))+'</button>';}).join('');
 var o=$('guideOut');if(!o)return;
 if(!state.guideItem){o.innerHTML='<div class="card note">'+esc(T('gHint'))+'</div>';return;}
 try{o.innerHTML=partnerHTML(state.guideItem);}catch(e){o.innerHTML='<div class="card note">'+esc(T('gHint'))+'</div>';}
}
function init(){
try{var l=localStorage.getItem('pesticide_lang_v2');if(l==='hi'||l==='en'||l==='gu')state.lang=l;}catch(e){}
applyLang();
showTab('search');
$('langBtn').addEventListener('click',function(){state.lang=state.lang==='en'?'hi':state.lang==='hi'?'gu':'en';applyLang();});
$('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)showTab(b.getAttribute('data-tab'));});
attachAutocomplete('searchInput','searchList',function(it){
$('searchInput').value=it.ingredient;state.searchItems=[it];state.searchDone=true;renderSearch();
},runSearch);
$('searchBtn').addEventListener('click',runSearch);
attachAutocomplete('tankInput','tankList',function(it){
state.tank.push(it);$('tankInput').value='';state.tankChecked=false;renderTankChips();renderTankOut();
},function(){var it=findOne($('tankInput').value);if(it){state.tank.push(it);$('tankInput').value='';state.tankChecked=false;renderTankChips();renderTankOut();}});
$('tankChips').addEventListener('click',function(e){var b=e.target.closest('button.x');if(!b)return;state.tank.splice(+b.getAttribute('data-i'),1);state.tankChecked=false;renderTankChips();renderTankOut();});
$('tankBtn').addEventListener('click',function(){state.tankChecked=true;renderTankOut();});
attachAutocomplete('rotInput','rotList',function(it){
state.rot.push(it);$('rotInput').value='';state.rotChecked=false;renderRotChips();renderRotOut();
},function(){var it=findOne($('rotInput').value);if(it){state.rot.push(it);$('rotInput').value='';state.rotChecked=false;renderRotChips();renderRotOut();}});
$('rotChips').addEventListener('click',function(e){var b=e.target.closest('button.x');if(!b)return;state.rot.splice(+b.getAttribute('data-i'),1);state.rotChecked=false;renderRotChips();renderRotOut();});
$('rotBtn').addEventListener('click',function(){state.rotChecked=true;renderRotOut();});
$('mixSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var s=b.getAttribute('data-sub'),bs=this.querySelectorAll('button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i]===b);['guide','tank','rot'].forEach(function(k){$('sub-'+k).classList.toggle('active',s===k);});});
attachAutocomplete('guideInput','guideList',function(it){$('guideInput').value=it.ingredient;state.guideItem=it;renderPartner();},function(){var it=findOne($('guideInput').value);if(it){state.guideItem=it;renderPartner();}});
$('guideQuick').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var it=findOne(b.getAttribute('data-q'));if(it){state.guideItem=it;$('guideInput').value=it.ingredient;renderPartner();var o=$('guideOut');if(o.scrollIntoView)o.scrollIntoView({behavior:'smooth',block:'start'});}});
$('browseBtns').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var c=b.getAttribute('data-bc');state.browseCat=state.browseCat===c?null:c;renderBrowse();});
$('browseChips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.searchItems=[{type:'group',cat:state.browseCat,code:b.getAttribute('data-g')}];state.searchDone=true;renderSearch();var o=$('searchOut');if(o.scrollIntoView)o.scrollIntoView({behavior:'smooth',block:'start'});});
$('ctlQ').addEventListener('input',renderProdQ);
$('ctlCrop').addEventListener('change',function(){CT.crop=this.value;CT.tgts=[];CT.q='';$('ctlFind').value='';renderCtlUI();});
$('ctlCats').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;CT.cat=b.getAttribute('data-cc');renderCtlUI();});
$('ctlFind').addEventListener('input',function(){CT.q=this.value;renderTList();});
$('ctlList').addEventListener('change',function(e){var c=e.target;if(!c||!c.getAttribute('data-t'))return;var t=+c.getAttribute('data-t'),i=CT.tgts.indexOf(t);if(c.checked&&i<0)CT.tgts.push(t);if(!c.checked&&i>=0)CT.tgts.splice(i,1);renderSel();renderCtl();});
$('ctlSel').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var i=CT.tgts.indexOf(+b.getAttribute('data-t'));if(i>=0)CT.tgts.splice(i,1);renderTList();renderCtl();});
$('ctlClear').addEventListener('click',function(){CT.tgts=[];renderTList();renderCtl();});
$('ctlAll').addEventListener('change',function(){CT.all=this.checked;renderCtl();});
$('ctlOut').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
var p=+b.getAttribute('data-p'),a=b.getAttribute('data-act');
if(a==='moa'){var seen={},its=[];pcodes(p).forEach(function(c){var k=c.cat+c.code;if(!seen[k]){seen[k]=1;its.push({type:'group',cat:c.cat,code:c.code});}});state.searchItems=its;state.searchDone=true;showTab('search');renderSearch();return;}
var it=itemFromProduct(p);if(!it)return;
if(a==='mix'){state.tank.push(it);state.tankChecked=false;renderTankChips();renderTankOut();}
else{state.rot.push(it);state.rotChecked=false;renderRotChips();renderRotOut();}
var t=b.textContent;b.textContent='✓';setTimeout(function(){b.textContent=t;},1200);
});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
