<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>ખેતી દવા માર્ગદર્શિકા</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#f1f8e9;color:#1b2a1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Gujarati","Noto Sans Devanagari",sans-serif;font-size:18px;line-height:1.4}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#f1f8e9}
header{background:#15803d;color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.brand{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.brand .lg{display:inline-block;animation:wig 3s ease-in-out infinite}
.langs{display:flex;gap:4px}
.langs button{min-width:46px;height:44px;border:2px solid #fff;background:transparent;color:#fff;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.langs button.on{background:#fff;color:#15803d}
#prog{display:flex;justify-content:center;gap:10px;padding:10px 8px 4px;background:#e8f5e9}
.dot{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid #c8e6c9;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .3s}
.dot.on{border-color:#15803d;background:#15803d;transform:scale(1.12);box-shadow:0 0 0 4px rgba(21,128,61,.2)}
.dot.done{border-color:#15803d;background:#c8e6c9}
#title{text-align:center;font-size:22px;font-weight:800;color:#14532d;padding:6px 12px 6px;background:#e8f5e9;margin:0}
#stage{flex:1;padding:12px 12px 20px;overflow-x:hidden}
.in-r{animation:slideR .35s ease both}.in-l{animation:slideL .35s ease both}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:3px solid #c8e6c9;border-radius:20px;padding:12px 6px;text-align:center;cursor:pointer;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:inherit;color:inherit;animation:pop .45s ease both}
.tile:active{transform:scale(.95);border-color:#15803d}
.tile .em{font-size:50px;line-height:1}
.tile .n1{font-size:19px;font-weight:800}
.tile .n2{font-size:13px;color:#5b6b5b}
.tile.off{opacity:.4;pointer-events:none;filter:grayscale(1)}
input.q{width:100%;height:56px;font-size:18px;border:3px solid #a5d6a7;border-radius:16px;padding:0 14px;margin-bottom:12px;font-family:inherit;background:#fff}
input.q:focus{outline:none;border-color:#15803d}
.types{display:flex;flex-direction:column;gap:14px}
.ty{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid #c8e6c9;border-radius:22px;padding:16px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;min-height:110px;animation:pop .45s ease both}
.ty:active{transform:scale(.97)}
.ty .em{font-size:60px;animation:bob 2.2s ease-in-out infinite}
.ty .n1{font-size:24px;font-weight:800}.ty .n2{font-size:14px;color:#5b6b5b}
.ty.pest{border-color:#f59e0b}.ty.dis{border-color:#8b5cf6}.ty.weed{border-color:#16a34a}
.ty.off{opacity:.4;pointer-events:none;filter:grayscale(1)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:#15803d;color:#fff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;animation:pop .3s ease both}
.plist{display:flex;flex-direction:column;gap:10px}
.pi{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #d7e3d7;border-radius:18px;padding:10px 12px;min-height:72px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;width:100%;animation:pop .4s ease both}
.pi .em{font-size:36px}
.pi .tx{flex:1;min-width:0}
.pi .n1{font-size:19px;font-weight:800;word-break:break-word}
.pi .n2{font-size:13px;color:#5b6b5b;word-break:break-word}
.pi .ck{width:38px;height:38px;border-radius:50%;border:3px solid #b0bec5;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex:none;transition:all .2s}
.pi.sel{border-color:#15803d;background:#e8f5e9}
.pi.sel .ck{background:#15803d;border-color:#15803d;animation:pop .3s ease}
footer{position:sticky;bottom:0;background:#fff;border-top:2px solid #c8e6c9;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20}
footer button{flex:1;min-height:58px;border:0;border-radius:16px;font-size:19px;font-weight:800;font-family:inherit;cursor:pointer;background:#e0e0e0;color:#333}
footer button.go{background:#15803d;color:#fff;animation:pulse 1.6s ease-in-out infinite}
footer button.go[disabled]{background:#b0bec5;animation:none}
footer button.sp{background:#1d4ed8;color:#fff}
.hdr{background:#fff;border-radius:20px;padding:12px;margin-bottom:12px;border:3px solid #c8e6c9;position:relative;overflow:hidden}
.hdr .row{display:flex;align-items:center;gap:10px}
.hdr .em{font-size:44px}
.hdr .cn{font-size:22px;font-weight:800}
.drops{position:absolute;right:12px;top:0;font-size:22px;pointer-events:none}
.drops span{position:absolute;animation:drop 1.8s linear infinite;opacity:0}
.drops span:nth-child(2){left:22px;animation-delay:.5s}.drops span:nth-child(3){left:44px;animation-delay:1s}
.tip{background:#fffde7;border:2px dashed #f9a825;border-radius:14px;padding:10px 12px;margin:10px 0;font-size:16px}
.rc{background:#fff;border-radius:22px;border:4px solid;padding:14px;animation:pop .5s ease both;position:relative}
.rc.l1{border-color:#16a34a}.rc.l2{border-color:#f59e0b}.rc.l3{border-color:#dc2626;background:#fff5f5}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rh .bul{font-size:34px}
.rh b{font-size:21px;display:block}.rh small{font-size:14px;color:#5b6b5b}
.star{position:absolute;right:10px;top:8px;font-size:34px;animation:pulse 1.3s ease-in-out infinite}
.pname{font-size:23px;font-weight:800;word-break:break-word;margin:4px 0}
.grp{display:inline-block;background:#eceff1;color:#455a64;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:6px}
.cov{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;margin:0 0 6px 6px}
.dose{background:#e3f2fd;border-radius:16px;padding:10px 12px;margin:8px 0;text-align:center}
.dose .pl{font-size:16px;color:#0d47a1;font-weight:700}
.dose .amt{font-size:34px;font-weight:900;color:#0d47a1;animation:pulse 2.4s ease-in-out infinite}
.dose .ac{font-size:14px;color:#37474f;margin-top:2px}
.phi{background:#fff3e0;border-radius:12px;padding:8px 10px;font-size:16px;font-weight:700;margin-top:6px}
.warn{background:#ffebee;color:#b71c1c;border:2px solid #e53935;border-radius:12px;padding:8px 10px;font-size:15px;font-weight:700;margin-top:8px}
.arrow{text-align:center;font-size:36px;animation:bob 1.4s ease-in-out infinite;margin:4px 0}
details{margin-top:10px}summary{font-size:17px;font-weight:800;cursor:pointer;min-height:44px;display:flex;align-items:center;color:#14532d}
.alt{border-top:1px solid #e0e0e0;padding:8px 0;font-size:16px}.alt b{display:block;word-break:break-word}.alt span{color:#0d47a1;font-weight:700}
.safe{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.safe div{background:#fff;border-radius:14px;padding:10px;font-size:15px;font-weight:700;border:2px solid #c8e6c9}
.note{font-size:14px;color:#5b6b5b;margin-top:12px}
.empty{background:#fff;border-radius:18px;padding:18px;text-align:center;font-size:18px;border:3px dashed #ef9a9a}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes slideR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes drop{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(54px);opacity:0}}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* counts */
var TC={};
function typeCounts(c){if(TC[c])return TC[c];rbInit();var m={insecticide:{},fungicide:{},herbicide:{}};(RB[c]||[]).forEach(function(i){var r=rec(i),t=pcat(r);if(m[t])m[t][r.tgt]=(m[t][r.tgt]||0)+1;});TC[c]=m;return m;}
function problemIds(){var m=typeCounts(S.crop)[S.type]||{};return Object.keys(m).map(Number).sort(function(a,b){var oa=/^Other \//.test(TGT[a]),ob=/^Other \//.test(TGT[b]);if(oa!==ob)return oa?1:-1;var x=TGT[a].toLowerCase(),y=TGT[b].toLowerCase();return x<y?-1:x>y?1:0;});}
/* dose helpers */
function pumpInfo(s){var m=/^([\d.]+)(?:\s*[–-]\s*([\d.]+))?\s*(ml|g)\/pump/i.exec(String(s||'').trim());if(!m)return null;return {lo:parseFloat(m[1]),hi:m[2]?parseFloat(m[2]):null,u:m[3].toLowerCase()};}
function nf(x){var r=x>=100?Math.round(x):Math.round(x*100)/100;return String(r);}
function rng(lo,hi,f){return hi!=null&&hi!==lo?f(lo)+' – '+f(hi):f(lo);}
function acreAmt(x){x=x*8.09;return x>=100?Math.round(x):Math.round(x*10)/10;}
function unitT(u){return u==='ml'?T('ml'):T('g');}
function phiText(s){var m=/^(\d+)\s*(d|days?)?$/i.exec(String(s||'').trim());if(m)return T('phi',{n:m[1]});return s?T('phiX',{n:s}):'';}
function legT(s){var x=LEGT[s];return x?(x[S.lang]||x.en):s;}
var GC={};
function groups(){var key=S.crop+'|'+S.type+'|'+S.lang;if(GC[key])return GC[key];var m={},arr=[];
 problemIds().forEach(function(t){var n=tName(t),k=n.a.toLowerCase();if(!m[k]){m[k]={key:k,ids:[],name:n};arr.push(m[k]);}m[k].ids.push(t);});GC[key]=arr;return arr;}
function selGroups(){return groups().filter(function(g){return g.ids.some(function(t){return S.sel.indexOf(t)>=0;});});}
function acreText(p){var k=p.lo*8.09,k2=p.hi!=null?p.hi*8.09:null,big=Math.max(k,k2||0)>=1000;
 function f(v){v=big?v/1000:v;return String(v>=100?Math.round(v):Math.round(v*10)/10);}
 var u=big?(p.u==='ml'?T('lt'):T('kg')):unitT(p.u);return T('acre',{p:8,a:(k2!=null&&k2!==k?f(k)+' – '+f(k2):f(k)),u:u});}
/* compute */
var LV={1:'🟢',2:'🟡',3:'🔴'};
function compute(){
 rbInit();var sel={},gmap={},gname={};S.sel.forEach(function(t){sel[t]=1;});groups().forEach(function(g){g.ids.forEach(function(t){gmap[t]=g.key;});gname[g.key]=g.name.a;});var by={},hidden=false;
 (RB[S.crop]||[]).forEach(function(i){
  var r=rec(i);if(!sel[r.tgt])return;var cs=pcodes(r.prd);if(!cs.length||pcat(r)!==S.type)return;
  var L1=LEG[r.leg]||'',P=PUMP[r.pump]||'';
  if(/Banned in India|Restricted/i.test(L1)||/Banned|Not allowed/i.test(P)){hidden=true;return;}
  var pi=pumpInfo(P);var nm=PRD[r.prd];
  if(!pi||/\b(FS|DS|GR|CG|WS)\b/i.test(nm)){hidden=true;return;}
  var o=by[r.prd]||(by[r.prd]={prd:r.prd,codes:cs,lv:+PS.charAt(r.prd)||2,rows:{},tg:{},leg:{},phi:{}});
  var key=P;(o.rows[key]=o.rows[key]||{pi:pi,t:[]});var gk=gmap[r.tgt];if(gk===undefined)return;if(o.rows[key].t.indexOf(gname[gk])<0)o.rows[key].t.push(gname[gk]);
  o.tg[gk]=1;if(L1)o.leg[L1]=1;if(PHI[r.phi])o.phi[PHI[r.phi]]=1;
 });
 var list=Object.keys(by).map(function(k){var o=by[k];o.cov=Object.keys(o.tg).length;return o;});
 var levels={1:[],2:[],3:[]};list.forEach(function(o){levels[o.lv>=1&&o.lv<=3?o.lv:2].push(o);});
 function cmp(lv){return function(a,b){var d=b.cov-a.cov;if(d)return d;d=(b.codes.length-a.codes.length)*(lv===1?-1:1);if(d)return d;return PRD[a.prd]<PRD[b.prd]?-1:1;};}
 var used={},steps=[];
 [1,2,3].forEach(function(lv){var a=levels[lv];if(!a.length)return;a.sort(cmp(lv));
  var rep=null;for(var i=0;i<a.length&&!rep;i++){var fresh=a[i].codes.every(function(c){return !used[c.cat+c.code];});if(fresh)rep=a[i];}
  if(!rep)rep=a[0];rep.codes.forEach(function(c){used[c.cat+c.code]=1;});
  steps.push({lv:lv,rep:rep,alts:a.filter(function(x){return x!==rep;}).slice(0,5)});});
 return {steps:steps,hidden:hidden,total:list.length,n:selGroups().length};
}
/* UI pieces */
function doseHTML(o){
 var keys=Object.keys(o.rows),h='';
 keys.slice(0,3).forEach(function(k){var x=o.rows[k],p=x.pi;
  var tn=keys.length>1?'<div class="ac"><b>'+x.t.slice(0,3).map(esc).join(', ')+'</b></div>':'';
  h+='<div class="dose">'+tn+'<div class="pl">💧 '+esc(T('pump'))+'</div><div class="amt">'+esc(rng(p.lo,p.hi,nf))+' '+esc(unitT(p.u))+'</div><div class="ac">'+esc(acreText(p))+'</div></div>';});
 return h;
}
function altLine(o){var k=Object.keys(o.rows)[0],p=o.rows[k].pi;return '<div class="alt"><b>'+esc(PRD[o.prd])+'</b><span>'+esc(rng(p.lo,p.hi,nf))+' '+esc(unitT(p.u))+' / '+esc(T('pump'))+'</span></div>';}
function card(st,top){
 var o=st.rep,lv=st.lv,n=RES.n,cs=o.codes;
 var grp=cs.map(function(c){return {insecticide:'IRAC',fungicide:'FRAC',herbicide:'HRAC'}[c.cat]+' '+c.code;}).join(' + ');
 var cov=n>1?'<span class="cov">'+esc(o.cov===n?T('coversAll'):T('covers',{a:o.cov,b:n}))+'</span>':'';
 var phis=Object.keys(o.phi);var ph=phis.length?'<div class="phi">'+esc(phiText(phis[0]))+'</div>':'';
 var lg=Object.keys(o.leg).filter(function(x){return !/Banned in India|Restricted/i.test(x);}).map(function(x){return '<div class="warn">⚠️ '+esc(legT(x))+'</div>';}).join('');
 var alts=st.alts.length?'<details><summary>➕ '+esc(T('others'))+' ('+st.alts.length+')</summary>'+st.alts.map(altLine).join('')+'</details>':'';
 return '<div class="rc l'+lv+'" style="animation-delay:'+(lv*0.15)+'s">'+(top?'<div class="star">⭐</div>':'')+
  '<div class="rh"><span class="bul">'+LV[lv]+'</span><div><b>'+esc(T('r'+lv))+'</b><small>'+esc(T('r'+lv+'s'))+'</small></div></div>'+
  '<div class="pname">'+esc(PRD[o.prd])+'</div><span class="grp">'+esc(T('group'))+': '+esc(grp)+'</span>'+cov+doseHTML(o)+ph+lg+alts+'</div>';
}
function speakText(res){
 var parts=[];res.steps.forEach(function(st){var o=st.rep,k=Object.keys(o.rows)[0],p=o.rows[k].pi;
  parts.push(T('r'+st.lv)+'. '+PRD[o.prd]+'. '+T('pump')+' '+rng(p.lo,p.hi,nf)+' '+unitT(p.u)+'.');});
 return parts.join(' ');
}
var RES=null;
function screen(){
 if(S.step===0){
  var q=S.cq.trim().toLowerCase(),ids=cropOrder().filter(function(i){if(!q)return true;var c=cropParts(i);return (c.en+' '+c.gu).toLowerCase().indexOf(q)>=0;});
  var t=ids.map(function(i,k){var c=cropName(i);return '<button class="tile" data-a="crop" data-i="'+i+'" style="animation-delay:'+Math.min(k,12)*0.04+'s"><span class="em">'+cropEm(cropParts(i).en)+'</span><span class="n1">'+esc(c.a)+'</span>'+(c.b?'<span class="n2">'+esc(c.b)+'</span>':'')+'</button>';}).join('');
  return '<input class="q" id="cq" type="text" autocomplete="off" placeholder="'+esc(T('cropPh'))+'" value="'+esc(S.cq)+'"><div class="grid" id="lst">'+(t||'<div class="empty">'+esc(T('noMatch'))+'</div>')+'</div>';
 }
 if(S.step===1){
  var m=typeCounts(S.crop),def=[['pest','insecticide','🐛','tPest','tPestS'],['dis','fungicide','🍄','tDis','tDisS'],['weed','herbicide','🌿','tWeed','tWeedS']];
  return '<div class="types">'+def.map(function(d,k){var n=Object.keys(m[d[1]]||{}).length;return '<button class="ty '+d[0]+(n?'':' off')+'" data-a="type" data-ty="'+d[1]+'" style="animation-delay:'+k*0.12+'s"><span class="em">'+d[2]+'</span><span><span class="n1">'+esc(T(d[3]))+'</span><br><span class="n2">'+esc(n?T(d[4]):T('none'))+'</span></span></button>';}).join('')+'</div>';
 }
 if(S.step===2){
  return '<input class="q" id="pq" type="text" autocomplete="off" placeholder="'+esc(T('findPh'))+'" value="'+esc(S.pq)+'"><div class="chips" id="chs"></div><div class="plist" id="lst"></div>';
 }
 return resultHTML();
}
function chipsHTML(){return selGroups().map(function(g){return '<span class="chip">'+esc(g.name.a)+'</span>';}).join('');}
function listHTML(){
 var q=S.pq.trim().toLowerCase(),gs=groups(),sg={};selGroups().forEach(function(g){sg[g.key]=1;});
 var out=gs.map(function(g,gi){return {g:g,gi:gi};}).filter(function(x){if(sg[x.g.key]||!q)return true;return (x.g.name.a+' '+x.g.name.b+' '+x.g.ids.map(function(t){return TGT[t];}).join(' ')).toLowerCase().indexOf(q)>=0;}).map(function(x,k){var g=x.g,n=g.name,s=sg[g.key];
  return '<button class="pi'+(s?' sel':'')+'" data-a="tog" data-g="'+x.gi+'" style="animation-delay:'+Math.min(k,10)*0.03+'s"><span class="em">'+tEm(g.ids[0],S.type)+'</span><span class="tx"><span class="n1">'+esc(n.a)+'</span>'+(n.b?'<br><span class="n2">'+esc(n.b)+'</span>':'')+'</span><span class="ck">'+(s?'✓':'')+'</span></button>';}).join('');
 return out||'<div class="empty">'+esc(T('noMatch'))+'</div>';
}
function resultHTML(){
 var c=cropName(S.crop),res=RES=compute(),ty={insecticide:'🐛',fungicide:'🍄',herbicide:'🌿'}[S.type];
 var head='<div class="hdr"><div class="drops"><span>💧</span><span>💧</span><span>💧</span></div><div class="row"><span class="em">'+cropEm(cropParts(S.crop).en)+'</span><div><div class="cn">'+esc(c.a)+'</div></div></div><div class="chips" style="margin:8px 0 0">'+selGroups().map(function(g){return '<span class="chip" style="background:#455a64">'+ty+' '+esc(g.name.a)+'</span>';}).join('')+'</div></div>';
 if(!res.steps.length)return head+'<div class="empty">🙏 '+esc(T('noRes'))+'</div>'+(res.hidden?'<div class="note">'+esc(T('hid'))+'</div>':'')+'<div class="note">'+esc(T('disc'))+'</div>';
 var topLv=res.steps[res.steps.length-1].lv,h=head;
 res.steps.forEach(function(st,k){if(k)h+='<div class="arrow">⬇️</div>';h+=card(st,st.lv===topLv&&res.steps.length>0);});
 h+='<div class="tip">'+esc(T('rotate'))+'</div><div class="safe"><div>'+esc(T('s_g'))+'</div><div>'+esc(T('s_w'))+'</div><div>'+esc(T('s_l'))+'</div><div>'+esc(T('s_e'))+'</div></div>';
 if(res.hidden)h+='<div class="note">'+esc(T('hid'))+'</div>';
 return h+'<div class="note">'+esc(T('disc'))+'</div>';
}
function footerHTML(){
 var b='',sp=window.speechSynthesis;
 if(S.step===1)b='<button data-a="back">'+esc(T('back'))+'</button>';
 if(S.step===2)b='<button data-a="back">'+esc(T('back'))+'</button><button class="go" data-a="next"'+(S.sel.length?'':' disabled')+'>'+esc(S.sel.length?T('next'):T('pickOne'))+'</button>';
 if(S.step===3)b='<button data-a="back">'+esc(T('back'))+'</button>'+(sp&&RES&&RES.steps.length?'<button class="sp" data-a="speak">'+esc(T('speak'))+'</button>':'')+'<button data-a="again">'+esc(T('again'))+'</button>';
 return b;
}
function progHTML(){var ic=['🌱','🎯','✅','💊'];return ic.map(function(e,i){return '<div class="dot'+(i===S.step?' on':i<S.step?' done':'')+'">'+(i<S.step?'✓':e)+'</div>';}).join('');}
function postH(){try{parent.postMessage({type:'kheti-guide-height',height:document.documentElement.scrollHeight},'*');}catch(e){}}
function render(){
 try{
  $('ttl').textContent=T('app');document.title=T('app');document.documentElement.lang=S.lang;
  var bs=document.querySelectorAll('#langs button');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-l')===S.lang);
  $('prog').innerHTML=progHTML();$('title').textContent=T('s'+(S.step+1));
  var st=$('stage');st.className=S.dir>0?'in-r':'in-l';
  st.innerHTML=screen();
  if(S.step===2){$('lst').innerHTML=listHTML();$('chs').innerHTML=chipsHTML();}
  $('ft').innerHTML=footerHTML();
  $('ft').style.display=$('ft').innerHTML?'flex':'none';
 }catch(e){$('stage').innerHTML='<div class="empty">'+esc(T('err'))+'<br><br><button class="tile" data-a="again" style="width:100%">'+esc(T('again'))+'</button></div>';$('ft').style.display='none';}
 postH();
}
function go(step,dir){stopSpeak();S.step=step;S.dir=dir;render();try{window.scrollTo(0,0);}catch(e){}}
function stopSpeak(){try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}
function speak(){
 try{var sp=window.speechSynthesis;if(!sp||!RES)return;if(sp.speaking){sp.cancel();return;}
  var u=new SpeechSynthesisUtterance(speakText(RES));u.lang={gu:'gu-IN',hi:'hi-IN',en:'en-IN'}[S.lang];u.rate=0.9;sp.speak(u);}catch(e){}
}
document.addEventListener('click',function(e){
 var b=e.target.closest?e.target.closest('[data-a],[data-l]'):null;if(!b)return;
 var l=b.getAttribute('data-l');if(l){S.lang=l;try{localStorage.setItem('kheti_lang',l);}catch(x){}S.dir=1;render();return;}
 var a=b.getAttribute('data-a');
 if(a==='crop'){S.crop=+b.getAttribute('data-i');S.type='';S.sel=[];S.pq='';go(1,1);}
 else if(a==='type'){S.type=b.getAttribute('data-ty');S.sel=[];S.pq='';go(2,1);}
 else if(a==='tog'){var g=groups()[+b.getAttribute('data-g')];if(!g)return;var any=g.ids.some(function(t){return S.sel.indexOf(t)>=0;});
  g.ids.forEach(function(t){var i=S.sel.indexOf(t);if(any){if(i>=0)S.sel.splice(i,1);}else if(i<0)S.sel.push(t);});
  b.classList.toggle('sel',!any);var ck=b.querySelector('.ck');if(ck)ck.textContent=!any?'✓':'';$('chs').innerHTML=chipsHTML();
  var nx=document.querySelector('#ft .go');if(nx){nx.disabled=!S.sel.length;nx.textContent=S.sel.length?T('next'):T('pickOne');}postH();}
 else if(a==='next'&&S.sel.length)go(3,1);
 else if(a==='back')go(Math.max(0,S.step-1),-1);
 else if(a==='again'){S.crop=null;S.type='';S.sel=[];S.cq='';S.pq='';go(0,-1);}
 else if(a==='speak')speak();
});
document.addEventListener('input',function(e){
 var t=e.target;if(!t||!t.id)return;
 if(t.id==='cq'){S.cq=t.value;var q=S.cq.trim().toLowerCase();var ids=cropOrder().filter(function(i){if(!q)return true;var c=cropParts(i);return (c.en+' '+c.gu).toLowerCase().indexOf(q)>=0;});
  $('lst').innerHTML=ids.map(function(i,k){var c=cropName(i);return '<button class="tile" data-a="crop" data-i="'+i+'" style="animation-delay:'+Math.min(k,12)*0.03+'s"><span class="em">'+cropEm(cropParts(i).en)+'</span><span class="n1">'+esc(c.a)+'</span>'+(c.b?'<span class="n2">'+esc(c.b)+'</span>':'')+'</button>';}).join('')||'<div class="empty">'+esc(T('noMatch'))+'</div>';postH();}
 if(t.id==='pq'){S.pq=t.value;$('lst').innerHTML=listHTML();postH();}
});
window.addEventListener('resize',postH);
try{var sl=localStorage.getItem('kheti_lang');if(sl==='gu'||sl==='hi'||sl==='en')S.lang=sl;}catch(e){}
render();
})();
</script>
<button id="inst" type="button" style="display:none;position:fixed;right:12px;bottom:90px;z-index:60;background:#15803d;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-size:16px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3);font-family:inherit">📲 Install</button>
<script>
(function(){var dp=null,b=document.getElementById('inst');
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;b.style.display='block';});
b.addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;b.style.display='none';});});
window.addEventListener('appinstalled',function(){b.style.display='none';});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}
})();
</script>
