<style>

    .farmer-form-container {

        font-family: Arial, sans-serif;

        background-color: #f0f8f0;

        display: flex;

        justify-content: center;

        align-items: center;

        min-height: 100vh;

        margin: 0;

        padding: 20px;

    }

    .farmer-form-box {

        background-color: white;

        padding: 30px;

        border-radius: 10px;

        box-shadow: 0 4px 8px rgba(0,0,0,0.1);

        max-width: 400px;

        width: 100%;

    }

    .farmer-form-box h1 {

        color: #2e7d32;

        text-align: center;

        margin-bottom: 20px;

    }

    .farmer-form-box label {

        display: block;

        margin-bottom: 5px;

        color: #333;

        font-weight: bold;

    }

    .farmer-form-box input,

    .farmer-form-box textarea {

        width: 100%;

        padding: 10px;

        margin-bottom: 15px;

        border: 1px solid #ccc;

        border-radius: 5px;

        box-sizing: border-box;

        font-size: 16px;

    }

    .farmer-form-box button {

        background-color: #2e7d32;

        color: white;

        border: none;

        padding: 12px;

        width: 100%;

        border-radius: 5px;

        font-size: 18px;

        cursor: pointer;

    }

    .farmer-form-box button:hover {

        background-color: #1b5e20;

    }

    .farmer-form-box .welcome {

        text-align: center;

        color: #2e7d32;

        font-size: 20px;

        margin-top: 20px;

    }

    .farmer-form-box .hidden {

        display: none;

    }

</style>



<div class="farmer-form-container">

    <div class="farmer-form-box">

        <h1>🌾 Farmer Welcome</h1>

        <div id="form-section">

            <form id="farmerForm">

                <label for="name">Your Name</label>

                <input type="text" id="name" name="name" required placeholder="Enter your name">



                <label for="mobile">Mobile Number</label>

                <input type="tel" id="mobile" name="mobile" required placeholder="Enter your mobile number">



                <label for="question">Do you have a question?</label>

                <textarea id="question" name="question" rows="3" placeholder="Type your question here..."></textarea>



                <button type="submit">Submit</button>

            </form>

        </div>

        <div id="welcome-section" class="hidden">

            <p class="welcome">Welcome back, <span id="farmerName"></span>!</p>

            <p style="text-align:center;">You are already registered. We will contact you soon.</p>

        </div>

    </div>

</div>



<script>

    (function() {

        const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mgaoovoy';

        const formSection = document.getElementById('form-section');

        const welcomeSection = document.getElementById('welcome-section');

        const farmerNameSpan = document.getElementById('farmerName');

        const farmerForm = document.getElementById('farmerForm');



        // Check if farmer is already saved

        const savedMobile = localStorage.getItem('farmerMobile');

        const savedName = localStorage.getItem('farmerName');



        if (savedMobile && savedName) {

            formSection.classList.add('hidden');

            welcomeSection.classList.remove('hidden');

            farmerNameSpan.textContent = savedName;

        }



        // Handle form submission

        farmerForm.addEventListener('submit', async (e) => {

            e.preventDefault();



            const formData = new FormData(farmerForm);

            const mobile = formData.get('mobile');

            const name = formData.get('name');



            try {

                const response = await fetch(FORMSPREE_ENDPOINT, {

                    method: 'POST',

                    body: formData,

                    headers: {

                        'Accept': 'application/json'

                    }

                });



                if (response.ok) {

                    localStorage.setItem('farmerMobile', mobile);

                    localStorage.setItem('farmerName', name);

                    formSection.classList.add('hidden');

                    welcomeSection.classList.remove('hidden');

                    farmerNameSpan.textContent = name;

                } else {

                    alert('Oops! Something went wrong. Please try again.');

                }

            } catch (error) {

                alert('Network error. Please check your internet connection.');

            }

        });

    })();

</script>
